<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14352c"><title>Campo GIS</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Campo GIS">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#16231e;--mut:#5d6b64;--ln:#d5dcd7;--pri:#14352c;--acc:#0f7b6c;--ok:#2e8b57;--reg:#d9a21b;--mal:#c0392b;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1714;--card:#18231e;--ink:#e6efe9;--mut:#93a39a;--ln:#2b3a33;--pri:#0b1f19;--acc:#3cc2ac}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{background:var(--pri);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:17px}#utm{font:12px/1.3 ui-monospace,Consolas,monospace;text-align:right}
main{flex:1;overflow:auto;position:relative}
section{display:none;height:100%;overflow:auto;padding:12px}section.on{display:block}
#v-map{padding:0}#map{height:100%;min-height:300px}
nav{display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:11px 2px;font:600 13px inherit;font-family:inherit}
nav button.on{color:var(--acc);box-shadow:inset 0 3px var(--acc)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:9px;background:var(--acc);color:#fff;font:700 15px inherit;font-family:inherit;margin-top:12px}
.btn.s{background:none;color:var(--acc);border:1.5px solid var(--acc)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;color:#fff;font-size:12px;font-weight:700}
.Bueno{background:var(--ok)}.Regular{background:var(--reg)}.Malo{background:var(--mal)}.Rápido,.Medio{background:var(--ok)}.Lento{background:var(--reg)}.NoApto{background:var(--mal)}
.bar{height:10px;border-radius:5px;background:var(--acc);margin:3px 0 8px}
.h{font-size:12px;color:var(--mut)}h3{margin:4px 0 8px}img.ph{width:100%;border-radius:8px;margin-top:8px}
.big{font-size:30px;font-weight:700}.kpi{flex:1;text-align:center}
.hid{display:none}.fab{position:absolute;z-index:1000;right:10px;bottom:14px;display:flex;flex-direction:column;gap:8px}.fab button{border:0;border-radius:99px;padding:11px 15px;background:var(--pri);color:#fff;font-weight:700;font-size:13px;box-shadow:0 2px 8px #0006}table{width:100%;border-collapse:collapse}td,th{padding:4px;text-align:left;font-size:13px}
</style></head><body>
<header><b>Campo GIS</b><div id="utm">Buscando GPS…</div></header>
<main>
<section id="v-map" class="on"><div id="map"></div><div class="fab"><button id="loc">Mi ubicación</button><button id="dl">Descargar zona</button></div></section>

<section id="v-reg"><div class="card"><h3>Nuevo registro</h3>
<label>Tipo</label><select id="r-tipo"><option>Componente</option><option>Cuerpo hídrico</option></select>
<label>Código o nombre</label><input id="r-cod" placeholder="Ej. COMP-014">
<label>Estado</label><select id="r-est"><option>Bueno</option><option>Regular</option><option>Malo</option></select>
<div id="hid" class="hid"><label>Tipo de cuerpo hídrico</label><select id="r-ht"><option>Río</option><option>Quebrada</option><option>Bofedal</option><option>Manantial</option><option>Laguna</option><option>Canal</option></select>
<div class="row"><div><label>Caudal (L/s)</label><input id="r-q" type="number" step="any"></div><div><label>pH</label><input id="r-ph" type="number" step="any"></div></div>
<div class="row"><div><label>CE (µS/cm)</label><input id="r-ce" type="number" step="any"></div><div><label>T° (°C)</label><input id="r-t" type="number" step="any"></div></div></div>
<label>Observaciones</label><textarea id="r-obs" rows="3"></textarea>
<label>Foto con coordenadas UTM</label><input id="r-foto" type="file" accept="image/*" capture="environment">
<button class="btn" id="r-save">Guardar registro</button></div></section>

<section id="v-per"><div class="card"><h3>Prueba de percolación</h3>
<label>Código del punto</label><input id="p-cod" placeholder="Ej. PERC-01">
<div class="row"><div><label>Profundidad (cm)</label><input id="p-prof" type="number" value="60"></div><div><label>Diámetro (cm)</label><input id="p-diam" type="number" value="30"></div></div>
<label>Lecturas de descenso</label><table id="p-tab"></table>
<button class="btn s" id="p-cron">Iniciar cronómetro</button><div class="row" style="margin-top:8px"><div><input id="p-t" type="number" step="any" placeholder="Tiempo (min)"></div><div><input id="p-d" type="number" step="any" placeholder="Descenso (cm)"></div></div>
<button class="btn s" id="p-add">Añadir lectura</button>
<div id="p-res" class="card" style="margin-top:12px">Añade al menos una lectura.</div>
<button class="btn" id="p-save">Guardar prueba</button></div></section>

<section id="v-dat"><div class="row" id="kpis"></div><div class="card" id="grf"></div><select id="flt"><option value="">Todos los tipos</option><option>Componente</option><option>Cuerpo hídrico</option><option>Percolación</option></select><div class="row" style="margin-top:8px"><button class="btn s" id="x-geo">GeoJSON</button><button class="btn s" id="x-csv">CSV</button></div><div class="row"><button class="btn s" id="x-kml">KML</button><button class="btn s" id="x-json">Respaldo</button></div><label class="btn s" style="text-align:center">Restaurar respaldo<input id="x-imp" type="file" accept=".json" hidden></label><div id="lista" style="margin-top:12px"></div></section>
</main>
<nav><button data-v="map" class="on">Mapa</button><button data-v="reg">Registrar</button><button data-v="per">Percolación</button><button data-v="dat">Datos</button></nav>
<script>
const $=id=>document.getElementById(id);
let recs=[],pos=null,lect=[];
try{recs=JSON.parse(localStorage.getItem('campo_recs')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('campo_recs',JSON.stringify(recs))}catch(e){alert('Memoria llena: exporta y borra registros antiguos.')}};
function utm(lat,lon){const a=6378137,f=1/298.257223563,k=.9996,e2=f*(2-f),ep=e2/(1-e2),z=Math.floor((lon+180)/6)+1,l0=((z-1)*6-177)*Math.PI/180,p=lat*Math.PI/180,l=lon*Math.PI/180,N=a/Math.sqrt(1-e2*Math.sin(p)**2),T=Math.tan(p)**2,C=ep*Math.cos(p)**2,A=Math.cos(p)*(l-l0),
M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*p-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*p)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*p)-35*e2**3/3072*Math.sin(6*p));
let n=k*(M+N*Math.tan(p)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep)*A**6/720));if(lat<0)n+=1e7;
return{z,h:lat<0?'S':'N',e:k*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep)*A**5/120)+5e5,n}}
const fu=u=>`${u.z}${u.h} E ${u.e.toFixed(0)} N ${u.n.toFixed(0)}`;

// Mapa
const map=L.map('map',{zoomControl:false}).setView([-12.05,-77.04],6);
const Off=L.TileLayer.extend({createTile(c,done){const t=document.createElement('img'),u=this.getTileUrl(c);
(window.caches?caches.open('tiles').then(h=>h.match(u)):Promise.resolve()).then(r=>r?r.blob():fetch(u).then(x=>x.blob())).then(b=>{t.src=URL.createObjectURL(b);done(null,t)}).catch(()=>{t.src=u;done(null,t)});return t}});
const sat=new Off('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}).addTo(map);
const osm=new Off('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'});
let act=sat;map.on('baselayerchange',e=>act=e.layer);L.control.layers({Satélite:sat,Calles:osm}).addTo(map);L.control.scale({imperial:false}).addTo(map);
const grp=L.layerGroup().addTo(map);let me=null,first=true;
const col={Bueno:'#2e8b57',Regular:'#d9a21b',Malo:'#c0392b',Rápido:'#2e8b57',Medio:'#2e8b57',Lento:'#d9a21b',NoApto:'#c0392b'};
function pintar(){grp.clearLayers();recs.forEach(r=>L.circleMarker([r.lat,r.lon],{radius:9,color:'#fff',weight:2,fillColor:col[r.estado]||'#0f7b6c',fillOpacity:1}).bindPopup(`<b>${r.cod}</b><br>${r.tipo} · ${r.estado}<br>${r.utm}`).addTo(grp))}
navigator.geolocation&&navigator.geolocation.watchPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
$('utm').innerHTML=fu(utm(pos.lat,pos.lon))+`<br>±${pos.acc.toFixed(0)} m`;
if(me)me.setLatLng([pos.lat,pos.lon]);else me=L.circleMarker([pos.lat,pos.lon],{radius:8,color:'#fff',fillColor:'#1e6fff',fillOpacity:1}).addTo(map);
if(first){map.setView([pos.lat,pos.lon],17);first=false}},()=>$('utm').textContent='GPS no disponible: activa la ubicación',{enableHighAccuracy:true,maximumAge:2000});

// Navegación
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('v-'+b.dataset.v).classList.add('on');
if(b.dataset.v=='map')setTimeout(()=>map.invalidateSize(),50);if(b.dataset.v=='dat')dash()});
$('r-tipo').onchange=()=>$('hid').classList.toggle('hid',$('r-tipo').value!='Cuerpo hídrico');

// Foto con marca de agua
function foto(file,txt){return new Promise(ok=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,c.height-46,c.width,46);x.fillStyle='#fff';x.font='bold 15px sans-serif';x.fillText(txt[0],8,c.height-26);x.fillText(txt[1],8,c.height-8);ok(c.toDataURL('image/jpeg',.6))};im.src=URL.createObjectURL(file)})}
function needGps(){if(!pos){alert('Aún no hay señal GPS. Espera a ver las coordenadas arriba.');return false}return !(pos.acc>25)||confirm('Precisión GPS de ±'+pos.acc.toFixed(0)+' m. ¿Guardar igual?')}
const base=()=>({id:Date.now(),lat:pos.lat,lon:pos.lon,acc:pos.acc,utm:fu(utm(pos.lat,pos.lon)),fecha:new Date().toLocaleString('es-PE')});

$('r-save').onclick=async()=>{if(!needGps())return;const cod=$('r-cod').value.trim();if(!cod){alert('Escribe el código o nombre.');return}
const r={...base(),tipo:$('r-tipo').value,cod,estado:$('r-est').value,obs:$('r-obs').value};
if(r.tipo=='Cuerpo hídrico')Object.assign(r,{hid:$('r-ht').value,caudal:$('r-q').value,ph:$('r-ph').value,ce:$('r-ce').value,temp:$('r-t').value});
const f=$('r-foto').files[0];if(f)r.foto=await foto(f,[cod+' · '+r.estado,r.utm+' · '+r.fecha]);
recs.push(r);save();pintar();['r-cod','r-obs','r-q','r-ph','r-ce','r-t'].forEach(i=>$(i).value='');$('r-foto').value='';alert('Registro guardado en '+r.utm)};

// Percolación (clasificación tipo RNE IS.020: tiempo para descender 2,5 cm; verifica umbrales con tu norma)
function clase(m){return m<=4?'Rápido':m<=12?'Medio':m<=24?'Lento':'NoApto'}
function calc(){const t=$('p-tab');t.innerHTML='<tr><th>Min</th><th>Desc. cm</th><th>Min/cm</th></tr>'+lect.map(l=>`<tr><td>${l.t}</td><td>${l.d}</td><td>${(l.t/l.d).toFixed(2)}</td></tr>`).join('');
if(!lect.length){$('p-res').textContent='Añade al menos una lectura.';return null}
const u=lect[lect.length-1],mpc=u.t/u.d,m25=mpc*2.5,c=clase(m25);
$('p-res').innerHTML=`Tasa final: <b>${mpc.toFixed(2)} min/cm</b> (${m25.toFixed(1)} min por 2,5 cm)<br><span class="pill ${c}">${c=='NoApto'?'No apto':c}</span>`;return{mpc,m25,c}}
$('p-add').onclick=()=>{const t=+$('p-t').value,d=+$('p-d').value;if(!(t>0&&d>0)){alert('Ingresa tiempo y descenso mayores a 0.');return}lect.push({t,d});$('p-t').value=$('p-d').value='';calc()};
$('p-save').onclick=()=>{if(!needGps())return;const cod=$('p-cod').value.trim(),c=calc();if(!cod||!c){alert('Falta el código o las lecturas.');return}
recs.push({...base(),tipo:'Percolación',cod,estado:c.c,prof:$('p-prof').value,diam:$('p-diam').value,lecturas:lect,mpc:c.mpc.toFixed(2),m25:c.m25.toFixed(1),obs:''});
save();pintar();lect=[];$('p-cod').value='';calc();alert('Prueba guardada')};

// Dashboard y exportación
function dash(){const por=k=>recs.reduce((a,r)=>(a[r[k]]=(a[r[k]]||0)+1,a),{});
$('kpis').innerHTML=['Componente','Cuerpo hídrico','Percolación'].map(t=>`<div class="card kpi"><div class="big">${recs.filter(r=>r.tipo==t).length}</div><div class="h">${t}</div></div>`).join('');
const e=por('estado'),mx=Math.max(1,...Object.values(e));
$('grf').innerHTML='<h3>Registros por estado</h3>'+(Object.keys(e).length?Object.entries(e).map(([k,v])=>`<div>${k=='NoApto'?'No apto':k}: <b>${v}</b></div><div class="bar" style="width:${v/mx*100}%;background:${col[k]}"></div>`).join(''):'<span class="h">Sin datos todavía. Guarda tu primer registro.</span>');
$('lista').innerHTML=recs.filter(r=>!$('flt').value||r.tipo==$('flt').value).slice().reverse().map(r=>`<div class="card"><b>${r.cod}</b> <span class="pill ${r.estado}">${r.estado=='NoApto'?'No apto':r.estado}</span><div class="h">${r.tipo} · ${r.fecha}<br>${r.utm}</div>${r.foto?`<img class="ph" src="${r.foto}">`:''}<button class="btn s" onclick="del(${r.id})">Eliminar</button></div>`).join('')}
window.del=id=>{if(confirm('¿Eliminar este registro?')){recs=recs.filter(r=>r.id!=id);save();pintar();dash()}};
function bajar(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
$('x-geo').onclick=()=>bajar('campo.geojson',JSON.stringify({type:'FeatureCollection',features:recs.map(r=>{const{lat,lon,foto,...p}=r;return{type:'Feature',geometry:{type:'Point',coordinates:[lon,lat]},properties:p}})}),'application/geo+json');
$('x-csv').onclick=()=>{const k=['fecha','tipo','cod','estado','utm','lat','lon','acc','hid','caudal','ph','ce','temp','prof','diam','mpc','m25','obs'];
bajar('campo.csv','\ufeff'+k.join(',')+'\n'+recs.map(r=>k.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')};
$('flt').onchange=dash;
$('loc').onclick=()=>pos?map.setView([pos.lat,pos.lon],18):alert('Aún no hay señal GPS.');
$('dl').onclick=async()=>{if(!window.caches){alert('Abre la app desde HTTPS para guardar mapas.');return}
const b=map.getBounds(),z0=map.getZoom(),z1=Math.min(z0+2,18),us=[];
for(let z=z0;z<=z1;z++){const n=2**z,X=o=>Math.floor((o+180)/360*n),Y=a=>{const r=a*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)};
for(let i=X(b.getWest());i<=X(b.getEast());i++)for(let j=Y(b.getNorth());j<=Y(b.getSouth());j++)us.push(act._url.replace('{z}',z).replace('{x}',i).replace('{y}',j))}
if(us.length>1500){alert('Son '+us.length+' teselas. Acércate al área de trabajo (máx. 1500).');return}
if(!confirm('Descargar '+us.length+' teselas (~'+Math.ceil(us.length*.02)+' MB) para usar sin señal?'))return;
const h=await caches.open('tiles');
for(let i=0;i<us.length;i+=6){await Promise.all(us.slice(i,i+6).map(u=>fetch(u).then(r=>r.ok&&h.put(u,r)).catch(()=>{})));$('dl').textContent='Descargando '+Math.round(Math.min(us.length,i+6)/us.length*100)+'%'}
$('dl').textContent='Descargar zona';alert('Zona guardada para uso sin señal.')};
let c0=null,iv;$('p-cron').onclick=()=>{if(c0==null){c0=Date.now();iv=setInterval(()=>$('p-cron').textContent='Detener: '+((Date.now()-c0)/60000).toFixed(2)+' min',500)}else{clearInterval(iv);$('p-t').value=((Date.now()-c0)/60000).toFixed(2);c0=null;$('p-cron').textContent='Iniciar cronómetro'}};
const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('x-kml').onclick=()=>bajar('campo.kml','<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document>'+recs.map(r=>'<Placemark><name>'+esc(r.cod)+'</name><description>'+esc(r.tipo+' · '+r.estado+' · '+r.utm+' · '+(r.obs||''))+'</description><Point><coordinates>'+r.lon+','+r.lat+',0</coordinates></Point></Placemark>').join('')+'</Document></kml>','application/vnd.google-earth.kml+xml');
$('x-json').onclick=()=>bajar('respaldo-campo.json',JSON.stringify(recs),'application/json');
$('x-imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const n=JSON.parse(rd.result);recs=[...recs,...n.filter(x=>!recs.some(r=>r.id==x.id))];save();pintar();dash();alert('Respaldo restaurado.')}catch(_){alert('Archivo de respaldo no válido.')}};rd.readAsText(f)};
pintar();dash();
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
